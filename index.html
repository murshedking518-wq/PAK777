            if ([1,3,7,9].includes(n)) return 'bg-green-600';

            return 'bg-purple-600';

        function calculateRoomOutcome(rk) {
            const r = window.appState.wingoRooms[rk];
            const num = r.override !== 'AUTO' ? parseInt(r.override) : Math.floor(Math.random() * 10);
            const size = num >= 5 ? 'Big' : 'Small';
            const color = [1,3,7,9].includes(num) ? 'Green' : ([2,4,6,8].includes(num) ? 'Red' : 'Violet');
            r.history.unshift({period: String(r.period), number: num, size, color});
            
            if (window.appState.activeUser) {
                r.myBets.forEach(b => {
                    if (b.period === String(r.period)) {
                        const win = (typeof b.target === 'number' && b.target === num) || b.target === size || b.target === color;
                        if (win) {
                            const payout = b.amount * 2.95;
                            window.appState.activeUser.balance += payout;
                            saveUserToCloud(window.appState.activeUser);
                            showToast(`WIN! +Rs ${payout.toFixed(2)}`,'success');
                        }
                    }
                });

            r.period += 1;
            updateBalanceDisplay();
            if (window.appState.currentTab === 'wingo') renderContent();

                                <div class="text-[10px] text-gray-500">${w.accountTitle} - ${w.accountNum}</div>
                            </div>
                            <button onclick="adminApproveWds('${w.id}')" class="bg-green-600 px-3 py-1.5 rounded-lg text-xs font-bold text-white">APPROVE</button>
                        </div>
                    </div>
                `).join('') || '<p class="text-xs text-gray-500">No pending withdrawals</p>';
            }
        };
        
        window.modifyUserBal = async (phone, factor) => {
            const input = document.getElementById(`adj-${phone}`);
            if (!input) return;
            const val = parseFloat(input.value);
            if (isNaN(val) || val <= 0) { showToast('Enter valid amount!', 'error'); return; }
            
            const user = window.appState.users.find(u => u.phone === phone);
            if (user) {
                user.balance = Math.max(0, user.balance + (val * factor));
                await saveUserToCloud(user);
                if (window.appState.activeUser && window.appState.activeUser.phone === user.phone) {
                    window.appState.activeUser.balance = user.balance;
                }
                updateBalanceDisplay();
                renderAdminData();
                showToast(`Balance updated: Rs ${user.balance.toFixed(2)}`, 'success');
            }
        };
        
        window.saveAdminAviator = async () => {
            const val = document.getElementById('admin-aviator-val').value.trim();
            if (val) {
                window.appState.aviator.override = val;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin_config'), { aviatorOverride: val }, { merge: true });
                showToast('Aviator override set!', 'success');
            }
        };
        
        window.saveAdminOverride = () => {
            const roomKey = document.getElementById('admin-room-select').value;
            const val = document.getElementById('admin-override-val').value;
            window.appState.wingoRooms[roomKey].override = val;
            showToast(`Win Go ${roomKey} set to ${val}`, 'success');
        };
        
        window.adminApproveDep = async (id) => {
            const dep = window.appState.deposits.find(d => d.id === id);
            if (!dep || dep.status !== 'Pending') return;
            
            dep.status = 'Completed';
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'deposits', dep.id), dep);
            
            const user = window.appState.users.find(u => u.phone === dep.userPhone);
            if (user) {
                user.balance += dep.amount;
                await saveUserToCloud(user);
                if (window.appState.activeUser && window.appState.activeUser.phone === user.phone) {
                    window.appState.activeUser.balance = user.balance;
                }
                updateBalanceDisplay();
            }
            
            renderAdminData();
            showToast(`Deposit Rs ${dep.amount} approved for ${dep.userName}!`, 'success');
        };
        
        window.adminApproveWds = async (id) => {
            const wds = window.appState.withdrawals.find(w => w.id === id);
            if (!wds || wds.status !== 'Pending') return;
            
            wds.status = 'Completed';
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'withdrawals', wds.id), wds);
            
            renderAdminData();
            showToast(`Withdrawal Rs ${wds.amount} approved!`, 'success');
        };

        // ============ FIREBASE HELPERS ============
        async function saveUserToCloud(user) {
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.phone), user, { merge: true });
            } catch(e) {
                console.error("Error saving user:", e);
            }
        }

        // ============ TIMERS ============
        function startRoomTimers() {
            setInterval(() => {
                Object.keys(window.appState.wingoRooms).forEach(rk => {
                    const r = window.appState.wingoRooms[rk];
                    r.timerSec--;
                    if (r.timerSec <= 0) {
                        calculateRoomOutcome(rk);
                        r.timerSec = r.totalSec;
                    }
                });
                const el = document.getElementById('active-room-timer');
                if (el) {
                    const r = window.appState.wingoRooms[window.appState.activeWinGoRoom];
                    const m = Math.floor(r.timerSec / 60);
                    const s = r.timerSec % 60;
                    el.innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
                }
            }, 1000);
        }

        function initSeedHistory() {
            Object.keys(window.appState.wingoRooms).forEach(rk => {
                const r = window.appState.wingoRooms[rk];
                for (let i = 0; i < 5; i++) {
                    const n = Math.floor(Math.random() * 10);
                    r.history.push({
                        period: String(r.period - i - 1),
                        number: n,
                        size: n >= 5 ? 'Big' : 'Small',
                        color: [1,3,7,9].includes(n) ? 'Green' : ([2,4,6,8].includes(n) ? 'Red' : 'Violet')
                    });
                }
            });
        }

        function createParticles() {
            const container = document.getElementById('particles-container');
            const colors = ['#ffd700', '#a855f7', '#00ff66', '#00d4ff'];
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 4 + 2;
                p.style.cssText = `
                    width: ${size}px; height: ${size}px;
                    left: ${Math.random() * 100}%;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    box-shadow: 0 0 ${size * 3}px currentColor;
                    animation-duration: ${Math.random() * 8 + 6}s;
                    animation-delay: ${Math.random() * 8}s;
                `;
                container.appendChild(p);
            }
        }

        function hideLoadingScreen() {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app-container').style.display = 'flex';
            }, 2000);
        }

        // ============ INIT ============
        window.addEventListener('DOMContentLoaded', async () => {
            createParticles();
            initSeedHistory();
            startRoomTimers();
            
            try {
                await signInAnonymously(auth);
            } catch(e) {
                console.error("Auth error:", e);
            }
            
            // Load users first
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                const list = [];
                snap.forEach(d => list.push(d.data()));
                window.appState.users = list;
                
                // Try to restore session AFTER users are loaded
                if (!window.appState.authenticated) {
                    loadSession();
                }
                
                // Update active user data
                if (window.appState.activeUser) {
                    const updated = list.find(u => u.phone === window.appState.activeUser.phone);
                    if (updated) {
                        window.appState.activeUser = updated;
                        updateBalanceDisplay();
                    }
                }
                renderAdminData();
            });
            
            // Load deposits
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'deposits'), (snap) => {
                const list = [];
                snap.forEach(d => list.push(d.data()));
                window.appState.deposits = list.sort((a, b) => b.timestamp - a.timestamp);
                if (window.appState.currentTab === 'deposit') renderContent();
                renderAdminData();
            });
            
            // Load withdrawals
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'withdrawals'), (snap) => {
                const list = [];
                snap.forEach(d => list.push(d.data()));
                window.appState.withdrawals = list.sort((a, b) => b.timestamp - a.timestamp);
                if (window.appState.currentTab === 'withdraw') renderContent();
                renderAdminData();
            });
            
            renderContent();
            hideLoadingScreen();
        });
    </script>
</body>
                    </html>
