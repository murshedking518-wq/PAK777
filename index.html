<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pak777 Casino | Premium Gaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: {
                            gold: '#ffd700',
                            purple: '#a855f7',
                            green: '#00ff66',
                            red: '#ff3333',
                            blue: '#00d4ff',
                            pink: '#ff006e',
                            dark: '#0a0a1a',
                            darker: '#050510',
                            card: 'rgba(20, 20, 50, 0.6)'
                        }
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-neon': 'pulseNeon 1.5s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'spin-slow': 'spin 3s linear infinite',
                        'bounce-subtle': 'bounceSubtle 2s ease-in-out infinite',
                        'shimmer': 'shimmer 2s linear infinite'
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(255,215,0,0.5), 0 0 20px rgba(255,215,0,0.3)' },
                            '100%': { boxShadow: '0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,215,0,0.5)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        pulseNeon: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.5' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        bounceSubtle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050510;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', monospace;
        }

        /* LOADING SCREEN */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: radial-gradient(ellipse at center, #0a0a2e 0%, #050510 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-ring {
            width: 80px;
            height: 80px;
            border: 3px solid rgba(255,215,0,0.2);
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 30px rgba(255,215,0,0.4), 0 0 60px rgba(255,215,0,0.2);
        }

        .loader-inner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(168,85,247,0.2);
            border-bottom: 3px solid #a855f7;
            border-radius: 50%;
            animation: spin 1.2s linear infinite reverse;
            position: absolute;
        }

        /* PARTICLES BACKGROUND */
        #particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle linear infinite;
            pointer-events: none;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* GLASS MORPHISM */
        .glass-card {
            background: rgba(20, 20, 50, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .glass-card-strong {
            background: rgba(30, 30, 70, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* NEON BUTTON */
        .neon-btn {
            position: relative;
            overflow: hidden;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .neon-btn:active {
            transform: scale(0.95);
        }
        .neon-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        .neon-btn-gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a0a00;
            box-shadow: 0 0 20px rgba(255,215,0,0.4), 0 4px 15px rgba(0,0,0,0.3);
        }
        .neon-btn-green {
            background: linear-gradient(135deg, #00ff66, #00cc44);
            color: #001a00;
            box-shadow: 0 0 20px rgba(0,255,102,0.4), 0 4px 15px rgba(0,0,0,0.3);
        }
        .neon-btn-red {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            color: #fff;
            box-shadow: 0 0 20px rgba(255,51,51,0.4), 0 4px 15px rgba(0,0,0,0.3);
        }
        .neon-btn-purple {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            box-shadow: 0 0 20px rgba(168,85,247,0.4), 0 4px 15px rgba(0,0,0,0.3);
        }

        /* GAME CARD 3D */
        .game-card-3d {
            perspective: 1000px;
            cursor: pointer;
        }
        .game-card-3d-inner {
            transition: transform 0.3s ease;
            transform-style: preserve-3d;
        }
        .game-card-3d:hover .game-card-3d-inner {
            transform: rotateY(5deg) rotateX(3deg) translateY(-5px);
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.5); border-radius: 10px; }

        /* AVIATOR STYLES */
        :root {
            --av-neon-red: #ff0055;
            --av-neon-green: #00ff66;
            --av-neon-orange: #ff9900;
            --av-neon-cyan: #00e5ff;
        }
        
        .av-game-container {
            width: 100%;
            background: #020210;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(168,85,247,0.2);
        }

        .av-history-bar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #000;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .av-history-bar::-webkit-scrollbar { display: none; }

        .av-history-chip {
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--av-neon-cyan);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .av-history-chip.high { color: #bf5af2; border-color: rgba(191, 90, 242, 0.4); }
        .av-history-chip.huge { color: var(--av-neon-red); border-color: rgba(255, 0, 85, 0.5); }

        .av-screen-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #000;
            overflow: hidden;
        }
        .av-screen-container canvas { width: 100%; height: 100%; display: block; }

        .av-toast {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: rgba(0, 255, 102, 0.95);
            color: #000;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 14px;
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.7);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 10;
            pointer-events: none;
        }
        .av-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .av-controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 10px;
            background: #050510;
        }

        .av-bet-box {
            background: rgba(10, 10, 30, 0.8);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .av-bet-inputs { display: flex; gap: 10px; align-items: center; }
        .av-amount-control { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        
        .av-input-wrapper {
            display: flex;
            align-items: center;
            background: #000;
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .av-btn-step {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            padding: 0 10px;
        }
        .av-bet-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-weight: 800;
            font-size: 18px;
            font-family: 'Orbitron', monospace;
            outline: none;
        }

        .av-preset-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .av-btn-preset {
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }
        .av-btn-preset:hover:not(:disabled) { background: rgba(168,85,247,0.3); border-color: #a855f7; }

        .av-btn-action {
            flex: 1.1;
            height: 72px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .av-btn-action:active { transform: scale(0.95); }
        .av-btn-action.bet {
            background: linear-gradient(180deg, #00ff66 0%, #00b347 100%);
            color: #000;
            box-shadow: 0 0 20px rgba(0,255,102,0.3);
        }
        .av-btn-action.cashout {
            background: linear-gradient(180deg, #ff9900 0%, #cc7a00 100%);
            color: #000;
            box-shadow: 0 0 25px rgba(255,153,0,0.5);
            animation: pulseGlow 0.5s infinite alternate;
        }
        .av-btn-action.queued {
            background: linear-gradient(180deg, #ff0055 0%, #b3003b 100%);
            color: #fff;
            box-shadow: 0 0 20px rgba(255,0,85,0.4);
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(255,153,0,0.5); }
            100% { box-shadow: 0 0 40px rgba(255,153,0,0.8); }
        }
        .av-sub-text { font-size: 11px; font-weight: 600; opacity: 0.9; font-family: 'Poppins', sans-serif; }

        /* MODAL ANIMATION */
        .modal-enter {
            animation: modalIn 0.3s ease-out;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* TOAST */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            z-index: 9999;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { background: #00ff66; color: #000; }
        #toast.error { background: #ff3333; color: #fff; }
        #toast.info { background: #ffd700; color: #000; }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
            <div class="loader-ring"></div>
            <div class="loader-inner"></div>
        </div>
        <p class="font-orbitron text-lg mt-6 text-yellow-400 animate-pulse-neon tracking-wider">LOADING PAK777...</p>
        <p class="text-xs text-gray-400 mt-2 font-orbitron">Premium Gaming Experience</p>
    </div>

    <!-- PARTICLES BACKGROUND -->
    <div id="particles-container"></div>

    <!-- MAIN APP -->
    <div id="app-container" class="w-full max-w-md mx-auto min-h-screen relative flex flex-col z-10" style="display: none;">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-30 px-4 py-3 flex justify-between items-center" style="background: rgba(10,10,30,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(168,85,247,0.3);">
            <div onclick="switchTab('home')" class="cursor-pointer flex items-center gap-2">
                <span class="font-orbitron text-xl font-black tracking-wider" style="background: linear-gradient(135deg, #ffd700, #ffaa00); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PAK<span style="color:#ff3333; -webkit-text-fill-color: #ff3333;">777</span></span>
                <i class="fa-solid fa-crown text-yellow-400 text-sm animate-bounce-subtle"></i>
            </div>
            <div class="flex items-center gap-2">
                <div onclick="requireAuth(() => switchTab('deposit'))" class="glass-card px-3 py-1.5 rounded-full flex items-center gap-2 cursor-pointer hover:scale-105 transition-transform">
                    <i class="fa-solid fa-wallet text-yellow-400 text-xs"></i>
                    <span class="text-xs font-bold">Rs <span id="user-balance-display">0.00</span></span>
                    <i class="fa-solid fa-circle-plus text-green-400 text-xs"></i>
                </div>
                <button onclick="toggleAdminModal()" class="bg-red-600/80 text-white text-[10px] font-bold px-2.5 py-1 rounded-full border border-red-400/50 hover:bg-red-700 transition-all">
                    <i class="fa-solid fa-lock"></i>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-20 animate-fade-in"></main>

        <!-- BOTTOM NAV -->
        <nav class="fixed bottom-0 w-full max-w-md z-30 flex justify-around items-center py-2" style="background: rgba(10,10,30,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(168,85,247,0.3);">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-yellow-400">
                <i class="fa-solid fa-gamepad text-lg"></i>
                <span class="text-[9px] mt-0.5 font-medium">Home</span>
            </button>
            <button onclick="switchTab('activity')" id="nav-activity" class="flex flex-col items-center text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-gift text-lg"></i>
                <span class="text-[9px] mt-0.5 font-medium">Rewards</span>
            </button>
            <div onclick="showToast('Coming Soon!','info')" class="relative -top-5 cursor-pointer">
                <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-yellow-400 to-orange-500 p-1 shadow-2xl animate-float flex items-center justify-center">
                    <div class="w-full h-full rounded-full flex items-center justify-center border-2 border-yellow-200" style="background: rgba(10,10,30,0.9);">
                        <i class="fa-solid fa-dharmachakra text-yellow-400 text-2xl animate-spin-slow"></i>
                    </div>
                </div>
            </div>
            <button onclick="switchTab('promotion')" id="nav-promotion" class="flex flex-col items-center text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-heart text-lg"></i>
                <span class="text-[9px] mt-0.5 font-medium">Promo</span>
            </button>
            <button onclick="requireAuth(() => switchTab('account'))" id="nav-account" class="flex flex-col items-center text-gray-400 hover:text-gray-200">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[9px] mt-0.5 font-medium">Account</span>
            </button>
        </nav>
    </div>

    <!-- TOAST -->
    <div id="toast"><span id="toast-msg"></span></div>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" style="background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);">
        <div class="glass-card-strong w-full max-w-sm p-6 space-y-4 modal-enter">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 id="auth-modal-title" class="font-orbitron font-bold text-yellow-400 text-base">SIGN UP</h3>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div id="auth-name-container">
                    <label class="text-xs text-gray-300 font-medium">FULL NAME</label>
                    <input type="text" id="auth-fullname" placeholder="Enter your name" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white mt-1 focus:outline-none focus:border-yellow-400 transition-all font-medium">
                </div>
                <div>
                    <label class="text-xs text-gray-300 font-medium">PHONE NUMBER</label>
                    <div class="flex items-center mt-1 bg-black/50 border border-white/10 rounded-xl overflow-hidden">
                        <span class="bg-purple-900/50 px-3 py-3 text-yellow-400 font-bold text-sm">+92</span>
                        <input type="text" id="auth-phone" placeholder="3001234567" maxlength="10" class="w-full bg-transparent px-3 py-3 text-white focus:outline-none text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-300 font-medium">PASSWORD</label>
                    <input type="password" id="auth-pass" placeholder="Min 6 characters" maxlength="12" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white mt-1 focus:outline-none focus:border-yellow-400 transition-all font-medium">
                </div>
                <button onclick="processAuthSubmit()" id="auth-action-btn" class="w-full neon-btn neon-btn-gold py-3 rounded-xl font-orbitron font-bold text-sm tracking-wider">SIGN UP & PLAY</button>
            </div>
            <p class="text-center text-xs text-gray-400">
                <span id="auth-switch-text">Already have an account?</span>
                <button onclick="switchAuthMode()" id="auth-switch-btn" class="text-yellow-400 font-bold ml-1 hover:underline">LOGIN</button>
            </p>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="fixed inset-0 z-50 hidden flex flex-col overflow-y-auto p-4 max-w-md mx-auto" style="background: rgba(0,0,0,0.95);">
        <div class="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-red-500 text-xl"></i>
                <h2 class="font-orbitron font-bold text-white">ADMIN PANEL</h2>
            </div>
            <button onclick="toggleAdminModal()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="admin-login-box" class="glass-card-strong p-5 space-y-4 my-auto">
            <div class="text-center">
                <i class="fa-solid fa-lock text-yellow-400 text-3xl mb-2"></i>
                <h3 class="font-orbitron font-bold text-yellow-400">RESTRICTED AREA</h3>
            </div>
            <input type="email" id="admin-email" placeholder="Admin Email" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-400">
            <input type="password" id="admin-pass" placeholder="Password" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-400">
            <button onclick="handleAdminLogin()" class="w-full neon-btn neon-btn-gold py-3 rounded-xl font-bold text-sm">LOGIN</button>
        </div>
        <div id="admin-dashboard" class="hidden space-y-4 text-sm">
            <div class="glass-card p-4 space-y-2">
                <span class="font-orbitron font-bold text-yellow-400"><i class="fa-solid fa-users mr-2"></i>PLAYERS (<span id="admin-users-count">0</span>)</span>
                <div id="admin-users-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
            </div>
            <div class="glass-card p-4 space-y-3">
                <span class="font-orbitron font-bold text-yellow-400"><i class="fa-solid fa-plane-up mr-2"></i>AVIATOR OVERRIDE</span>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="admin-aviator-val" placeholder="AUTO or 2.50" class="bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-white text-sm uppercase focus:outline-none focus:border-yellow-400">
                    <button onclick="saveAdminAviator()" class="neon-btn neon-btn-red py-2 rounded-lg font-bold text-xs">SET</button>
                </div>
            </div>
            <div class="glass-card p-4 space-y-3">
                <span class="font-orbitron font-bold text-yellow-400"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>WIN GO OVERRIDE</span>

        function avDrawCanvas() {
            const canvas = document.getElementById('avGameCanvas');
            if(!canvas) return;
            if(canvas.width===0) avResizeCanvas();
            const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
            
            if(avEngine.status==='WAITING') {
                ctx.fillStyle='#fff'; ctx.font='700 20px Orbitron'; ctx.textAlign='center'; ctx.fillText('WAITING...',w/2,h/2-15);
                const bw=200,bh=4;
                ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.roundRect((w-bw)/2,h/2+10,bw,bh,2); ctx.fill();
                ctx.fillStyle='#ff0055'; ctx.shadowColor='#ff0055'; ctx.shadowBlur=12;
                ctx.roundRect((w-bw)/2,h/2+10,bw*Math.min(1,avEngine.waitingProgress),bh,2); ctx.fill(); ctx.shadowBlur=0;
                return;
            }

            const fp = Math.min(1,(performance.now()-avEngine.startTime)/1800);
            const px = Math.pow(fp,0.5)*0.85, py = Math.pow(fp,0.65)*0.82;
            const planeX = 35+px*(w-100), planeY = (h-35)-py*(h-100);
            if(avEngine.status==='IN_FLIGHT') avEngine.flightPath.push({x:planeX,y:planeY});

            if(avEngine.flightPath.length>1) {
                ctx.beginPath(); ctx.moveTo(0,h); avEngine.flightPath.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.lineTo(avEngine.flightPath[avEngine.flightPath.length-1].x,h); ctx.closePath();
                const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'rgba(255,0,85,0.6)'); g.addColorStop(1,'rgba(255,0,85,0)'); ctx.fillStyle=g; ctx.fill();
                ctx.beginPath(); ctx.moveTo(avEngine.flightPath[0].x,avEngine.flightPath[0].y); avEngine.flightPath.forEach(p=>ctx.lineTo(p.x,p.y));
                ctx.strokeStyle='#ff0055'; ctx.lineWidth=4; ctx.shadowColor='#ff0055'; ctx.shadowBlur=15; ctx.stroke(); ctx.shadowBlur=0;
            }

            if(avEngine.status==='IN_FLIGHT') {
                ctx.save(); ctx.translate(planeX,planeY); ctx.rotate(-0.3+fp*0.2);
                ctx.fillStyle='#ff0055'; ctx.shadowColor='#ff0055'; ctx.shadowBlur=15;
                ctx.beginPath(); ctx.moveTo(26,0);ctx.lineTo(8,-5);ctx.lineTo(-2,-20);ctx.lineTo(3,-20);ctx.lineTo(12,-4);ctx.lineTo(-14,-3);
                ctx.lineTo(-24,-13);ctx.lineTo(-20,-13);ctx.lineTo(-8,-2);ctx.lineTo(-20,0);ctx.lineTo(-8,2);ctx.lineTo(-20,13);ctx.lineTo(-24,13);
                ctx.lineTo(-14,3);ctx.lineTo(12,4);ctx.lineTo(3,20);ctx.lineTo(-2,20);ctx.lineTo(8,5);ctx.closePath();ctx.fill();
                ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.beginPath();ctx.ellipse(12,0,7,2,0,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#ff9900';ctx.shadowColor='#ff9900';ctx.shadowBlur=10;ctx.beginPath();ctx.ellipse(-24,0,18,3,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore();
            } else if(avEngine.status==='CRASHED'&&avEngine.flightPath.length>0) {
                const lp=avEngine.flightPath[avEngine.flightPath.length-1];
                if(avEngine.shockwave<80){avEngine.shockwave+=4;ctx.strokeStyle=`rgba(255,0,85,${1-avEngine.shockwave/80})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(lp.x,lp.y,avEngine.shockwave,0,Math.PI*2);ctx.stroke();}
                avEngine.particles.forEach(p=>{if(p.alpha<=0)return;p.x+=p.vx;p.y+=p.vy;p.alpha-=p.decay;ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.alpha);ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();});
                ctx.globalAlpha=1;ctx.shadowBlur=0;
            }

            ctx.textAlign='center';
            if(avEngine.status==='CRASHED'){ctx.fillStyle='#ff0055';ctx.font='900 36px Orbitron';ctx.shadowColor='#ff0055';ctx.shadowBlur=20;ctx.fillText('FLEW AWAY!',w/2,h/2-20);ctx.fillStyle='#fff';ctx.font='700 28px Orbitron';ctx.shadowBlur=0;ctx.fillText(avEngine.multiplier.toFixed(2)+'x',w/2,h/2+25);}
            else{ctx.fillStyle='#fff';ctx.font='900 48px Orbitron';ctx.shadowColor='rgba(255,0,85,0.4)';ctx.shadowBlur=20;ctx.fillText(avEngine.multiplier.toFixed(2)+'x',w/2,h/2);ctx.shadowBlur=0;}
        }

        window.adminApproveWds = async (id) => {
            const w=window.appState.withdrawals.find(x=>x.id===id);
            if(w){w.status='Completed';await window.saveWithdrawalToCloud(w);renderAdminData();showToast('Approved!','success');}
        };

        // ============ TIMERS ============
        function startRoomTimers(){
            setInterval(()=>{
                Object.keys(window.appState.wingoRooms).forEach(rk=>{
                    const r=window.appState.wingoRooms[rk];
                    r.timerSec--;
                    if(r.timerSec<=0){calculateRoomOutcome(rk);r.timerSec=r.totalSec;}
                });
                const el=document.getElementById('active-room-timer');
                if(el){const r=window.appState.wingoRooms[window.appState.activeWinGoRoom];const m=Math.floor(r.timerSec/60),s=r.timerSec%60;el.innerText=`${m<10?'0'+m:m}:${s<10?'0'+s:s}`;}
            },1000);
        }

        // ============ FIREBASE SYNC ============
        window.saveUserToCloud = async(u)=>{try{await setDoc(doc(db,'artifacts',appId,'public','data','users',u.phone),u,{merge:true});}catch(e){console.error(e);}};
        window.saveDepositToCloud = async(d)=>{try{await setDoc(doc(db,'artifacts',appId,'public','data','deposits',d.id),d);}catch(e){console.error(e);}};
        window.saveWithdrawalToCloud = async(w)=>{try{await setDoc(doc(db,'artifacts',appId,'public','data','withdrawals',w.id),w);}catch(e){console.error(e);}};
        window.saveSettingsToCloud = async(s)=>{try{await setDoc(doc(db,'artifacts',appId,'public','data','settings','admin_config'),s,{merge:true});}catch(e){console.error(e);}};

        // ============ INIT ============
        window.addEventListener('DOMContentLoaded', async()=>{
            createParticles();
            initSeedHistory();
            startRoomTimers();
            initAviatorEngine();
            try{await signInAnonymously(auth);}catch(e){}
            onSnapshot(collection(db,'artifacts',appId,'public','data','users'),(snap)=>{
                const list=[];snap.forEach(d=>list.push(d.data()));
                window.appState.users=list;
                if(!window.appState.authenticated)loadSession();
                if(window.appState.activeUser){
                    const updated=list.find(u=>u.phone===window.appState.activeUser.phone);
                    if(updated){window.appState.activeUser=updated;window.updateBalanceDisplay();}
                }
                renderAdminData();
            });
            onSnapshot(collection(db,'artifacts',appId,'public','data','deposits'),(snap)=>{
                const list=[];snap.forEach(d=>list.push(d.data()));
                window.appState.deposits=list.sort((a,b)=>b.timestamp-a.timestamp);
                if(window.appState.currentTab==='deposit')renderContent();renderAdminData();
            });
            onSnapshot(collection(db,'artifacts',appId,'public','data','withdrawals'),(snap)=>{
                const list=[];snap.forEach(d=>list.push(d.data()));
                window.appState.withdrawals=list.sort((a,b)=>b.timestamp-a.timestamp);
                if(window.appState.currentTab==='withdraw')renderContent();renderAdminData();
            });
            onSnapshot(doc(db,'artifacts',appId,'public','data','settings','admin_config'),(snap)=>{
                if(snap.exists()&&snap.data().aviatorOverride){
                    window.appState.aviator.override=snap.data().aviatorOverride;
                    const el=document.getElementById('admin-aviator-val');if(el)el.value=snap.data().aviatorOverride;
                }
            });
            renderContent();
            hideLoadingScreen();
        });

        function initSeedHistory(){
            Object.keys(window.appState.wingoRooms).forEach(rk=>{
                const r=window.appState.wingoRooms[rk];
                for(let i=0;i<5;i++){
                    const n=Math.floor(Math.random()*10);
                    r.history.push({period:String(r.period-i-1),number:n,size:n>=5?'Big':'Small',color:[1,3,7,9].includes(n)?'Green':([2,4,6,8].includes(n)?'Red':'Violet')});
                }
            });
        }
    </script>
</body>
    </html>
