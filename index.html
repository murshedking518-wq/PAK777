<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Trading - Investment Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    :root {
      --primary-dark: #075C2A;
      --deep-green: #08752F;
      --bright-green: #45D316;
      --lime: #B9FF16;
      --neon-lime: #D8FF18;
      --light-lime: #EFFFCA;
      --bg-soft: #F4F9F1;
      --white: #FFFFFF;
      --dark-text: #123B22;
      --muted-text: #718078;
      --orange: #FF9E27;
      --purple: #8B4DEB;
      --blue: #25AEEA;
      --turquoise: #20B8B5;
      --radius: 16px;
      --radius-lg: 24px;
      --shadow-soft: 0 4px 20px rgba(0,0,0,0.06);
      --shadow-medium: 0 8px 30px rgba(0,0,0,0.1);
    }
    body {
      background: var(--bg-soft);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: var(--dark-text);
    }
    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg-soft);
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 50px rgba(0,0,0,0.15);
    }
    .hidden { display: none !important; }
    /* Common */
    .btn-primary {
      background: linear-gradient(135deg, var(--lime), var(--bright-green));
      color: var(--dark-text);
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      transition: all 0.2s;
    }
    .btn-primary:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
    .btn-secondary {
      background: white;
      color: var(--dark-text);
      border: 2px solid #d0e0c8;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    /* Header */
    .app-header {
      background: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--lime), var(--bright-green));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .logo-icon i { color: var(--dark-text); }
    .logo-text {
      display: flex;
      flex-direction: column;
    }
    .logo-name {
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--dark-text);
      letter-spacing: 1px;
      line-height: 1;
    }
    .logo-sub {
      font-size: 0.7rem;
      color: var(--muted-text);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .hamburger-btn {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--lime), var(--bright-green));
      border-radius: 14px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .hamburger-btn i { color: var(--dark-text); }
    /* Landing */
    .landing-hero {
      background: linear-gradient(160deg, #0B5D32 0%, #168A3A 40%, #48C928 80%, #B9F51A 100%);
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
    }
    .hero-badge {
      background: rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: white;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .hero-title {
      font-size: 3rem;
      font-weight: 900;
      color: var(--dark-text);
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero-title span {
      display: block;
      color: rgba(255,255,255,0.9);
    }
    /* Nav */
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .nav-btn {
      padding: 10px 20px;
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .nav-btn.register {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
    }
    .nav-btn.login {
      background: white;
      color: var(--dark-text);
    }
    /* Auth */
    .auth-container {
      padding: 20px;
    }
    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-soft);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--dark-text);
      margin-bottom: 6px;
      display: block;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e8e0;
      border-radius: 12px;
      font-size: 0.95rem;
      background: white;
      transition: border 0.2s;
    }
    .form-input:focus {
      border-color: var(--bright-green);
      outline: none;
      box-shadow: 0 0 0 3px rgba(69,211,22,0.1);
    }
    /* Dashboard */
    .dashboard-hero {
      background: linear-gradient(135deg, var(--lime), var(--bright-green));
      padding: 20px;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #2d3a2d;
      border: 3px solid white;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
    }
    .rank-card {
      background: var(--dark-text);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      margin: 16px 0;
      border: 2px solid var(--lime);
    }
    .balance-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 0 8px var(--light-lime), 0 0 0 12px var(--lime), 0 0 40px rgba(69,211,22,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
    }
    .balance-label {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--muted-text);
      font-weight: 600;
    }
    .balance-value {
      font-size: 2rem;
      font-weight: 900;
      color: var(--dark-text);
    }
    .referral-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 16px;
    }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 20px;
      margin-bottom: 20px;
    }
    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .action-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
    }
    .action-icon.deposit { background: var(--light-lime); }
    .action-icon.withdraw { background: var(--orange); color: white; }
    .action-icon.team { background: var(--blue); color: white; }
    .action-icon.profit { background: var(--purple); color: white; }
    .action-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--dark-text);
    }
    .pending-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      margin: 0 20px 16px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 20px;
    }
    .stat-card {
      border-radius: 16px;
      padding: 16px;
      color: white;
    }
    .stat-card.green { background: linear-gradient(135deg, var(--bright-green), var(--deep-green)); }
    .stat-card.orange { background: linear-gradient(135deg, var(--orange), #E57300); }
    .stat-card.purple { background: linear-gradient(135deg, var(--purple), #5E35B1); }
    .stat-card.turquoise { background: linear-gradient(135deg, var(--turquoise), #00897B); }
    /* Plan Grid */
    .plan-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 20px;
    }
    .plan-card {
      background: white;
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-soft);
      border: 2px solid #e0e8e0;
    }
    .plan-header {
      font-weight: 800;
      color: var(--dark-text);
      margin-bottom: 8px;
    }
    .plan-amount {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--deep-green);
    }
    /* Drawer */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100%;
      background: white;
      z-index: 300;
      transition: right 0.3s;
      display: flex;
      flex-direction: column;
    }
    .drawer.active { right: 0; }
    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-items { flex: 1; overflow-y: auto; padding: 10px 0; }
    .drawer-item {
      padding: 14px 20px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-weight: 600;
      color: var(--dark-text);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .drawer-item:hover { background: var(--bg-soft); }
    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
    }
    .toast {
      background: var(--dark-text);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      animation: toastIn 0.3s, toastOut 0.3s 2.5s forwards;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }
  </style>
</head>
<body>
<div class="app-container" id="app"></div>
<div class="toast-container" id="toastContainer"></div>
<script>
  // ------------------- Data & State -------------------
  const PLAN_DATA = [
    { id: 1, name: 'Plan 1', oldPrice: 255, newPrice: 605, dailyProfit: 173, send: 350 },
    { id: 2, name: 'Plan 2', oldPrice: 755, newPrice: 1405, dailyProfit: 401, send: 650 },
    { id: 3, name: 'Plan 3', oldPrice: 1455, newPrice: 2405, dailyProfit: 687, send: 950 },
    { id: 4, name: 'Plan 4', oldPrice: 2255, newPrice: 3605, dailyProfit: 1030, send: 1350 },
    { id: 5, name: 'Plan 5', oldPrice: 3355, newPrice: 5205, dailyProfit: 1487, send: 1850 },
    { id: 6, name: 'Plan 6', oldPrice: 4155, newPrice: 6605, dailyProfit: 1887, send: 2450 },
    { id: 7, name: 'Plan 7', oldPrice: 7255, newPrice: 10805, dailyProfit: 3087, send: 3550 },
    { id: 8, name: 'Plan 8', oldPrice: 9855, newPrice: 15105, dailyProfit: 4316, send: 5250 },
    { id: 9, name: 'Plan 9', oldPrice: 16555, newPrice: 24805, dailyProfit: 7087, send: 8250 },
    { id: 10, name: 'Plan 10', oldPrice: 24555, newPrice: 36805, dailyProfit: 10516, send: 12250 },
    { id: 11, name: 'Plan 11', oldPrice: 34555, newPrice: 51805, dailyProfit: 14802, send: 17250 },
    { id: 12, name: 'Plan 12', oldPrice: 46555, newPrice: 70805, dailyProfit: 20230, send: 24250 },
    { id: 13, name: 'Plan 13', oldPrice: 0, newPrice: 0, dailyProfit: 0, send: 0 }, // demo placeholder
    { id: 14, name: 'Plan 14', oldPrice: 0, newPrice: 0, dailyProfit: 0, send: 0 },
    { id: 15, name: 'Plan 15', oldPrice: 0, newPrice: 0, dailyProfit: 0, send: 0 },
    { id: 16, name: 'Plan 16', oldPrice: 0, newPrice: 0, dailyProfit: 0, send: 0 },
  ];
  let state = {
    user: null,
    isLoggedIn: false,
    currentPage: 'landing',
    selectedPlan: null,
  };
  function loadState() {
    const saved = localStorage.getItem('solanaState');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
    if (state.isLoggedIn && state.user) {
      state.currentPage = 'dashboard';
    }
  }
  function saveState() {
    localStorage.setItem('solanaState', JSON.stringify({
      user: state.user,
      isLoggedIn: state.isLoggedIn,
      currentPage: state.currentPage,
    }));
  }
  function showToast(message) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }
  function formatCurrency(amount) {
    return 'Rs ' + Number(amount).toLocaleString('en-PK');
  }
  // ------------------- Navigation -------------------
  function navigateTo(page) {
    if (!state.isLoggedIn && page !== 'landing' && page !== 'login' && page !== 'register') {
      page = 'login';
    }
    state.currentPage = page;
    saveState();
    render();
  }
  // ------------------- Render -------------------
  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    switch(state.currentPage) {
      case 'landing': renderLanding(app); break;
      case 'login': renderLogin(app); break;
      case 'register': renderRegister(app); break;
      case 'dashboard': renderDashboard(app); break;
      case 'plans': renderPlans(app); break;
      case 'deposit': renderDeposit(app); break;
      case 'withdraw': renderWithdraw(app); break;
      case 'team': renderTeam(app); break;
      case 'profit': renderProfit(app); break;
      case 'transactions': renderTransactions(app); break;
      case 'profile': renderProfile(app); break;
      case 'verification': renderVerification(app); break;
      default: renderDashboard(app);
    }
  }
  // ------------------- Components -------------------
  function renderHeader(app, backBtn=false) {
    return `
      <div class="app-header">
        <div class="logo-container">
          <div class="logo-icon"><i data-lucide="leaf"></i></div>
          <div class="logo-text">
            <span class="logo-name">SOLANA</span>
            <span class="logo-sub">TRADING</span>
          </div>
        </div>
        <button class="hamburger-btn" onclick="toggleDrawer()"><i data-lucide="menu"></i></button>
      </div>
      ${backBtn ? `<button class="btn-secondary" onclick="navigateTo('dashboard')" style="margin:10px 20px;">← Back</button>` : ''}
    `;
  }
  function renderDrawer() {
    const drawerItems = [
      { label: 'Dashboard', icon: 'layout-dashboard', page: 'dashboard' },
      { label: 'Investment Plans', icon: 'trending-up', page: 'plans' },
      { label: 'Deposit', icon: 'wallet', page: 'deposit' },
      { label: 'Withdraw', icon: 'banknote', page: 'withdraw' },
      { label: 'My Team', icon: 'users', page: 'team' },
      { label: 'Next Profit', icon: 'clock', page: 'profit' },
      { label: 'Transactions', icon: 'receipt', page: 'transactions' },
      { label: 'Profile', icon: 'user', page: 'profile' },
      { label: 'Verification', icon: 'shield-check', page: 'verification' },
      { label: 'Logout', icon: 'log-out', page: 'logout' },
    ];
    return `
      <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
      <div class="drawer" id="drawer">
        <div class="drawer-header">
          <span style="font-weight:800;font-size:1.2rem;color:var(--dark-text)">Menu</span>
          <button class="btn-secondary" onclick="toggleDrawer(false)">✕</button>
        </div>
        <div class="drawer-items">
          ${drawerItems.map(item => `
            <button class="drawer-item" onclick="handleDrawerNavigation('${item.page}')">
              <i data-lucide="${item.icon}"></i> ${item.label}
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }
  function toggleDrawer(show) {
    const overlay = document.getElementById('drawerOverlay');
    const drawer = document.getElementById('drawer');
    if (overlay && drawer) {
      const isActive = show !== undefined ? show : !drawer.classList.contains('active');
      overlay.classList.toggle('active', isActive);
      drawer.classList.toggle('active', isActive);
    }
    lucide.createIcons();
  }
  function handleDrawerNavigation(page) {
    toggleDrawer(false);
    if (page === 'logout') {
      logout();
    } else {
      navigateTo(page);
    }
  }
  function logout() {
    state.isLoggedIn = false;
    state.user = null;
    saveState();
    navigateTo('landing');
  }
  // ------------------- Pages -------------------
  function renderLanding(app) {
    app.innerHTML = `
      ${renderHeader(app)}
      <div class="landing-hero">
        <div class="hero-badge">SMARTER GROWTH STARTS HERE</div>
        <h1 class="hero-title">Invest today.<span>Grow brighter.</span></h1>
        <div class="nav-buttons">
          <button class="nav-btn register" onclick="navigateTo('register')">Register →</button>
          <button class="nav-btn login" onclick="navigateTo('login')">Login</button>
        </div>
        <div style="display:flex;gap:16px;margin-top:20px;flex-wrap:wrap;justify-content:center;">
          <span style="color:white;font-size:0.8rem;">✅ Secure signup</span>
          <span style="color:white;font-size:0.8rem;">⚡ Quick start</span>
          <span style="color:white;font-size:0.8rem;">📈 Clear returns</span>
        </div>
        <div style="color:white;font-size:0.75rem;margin-top:16px;">Ranking System Ahead</div>
      </div>
      ${renderDrawer()}
    `;
    lucide.createIcons();
  }
  function renderLogin(app) {
    app.innerHTML = `
      ${renderHeader(app, true)}
      <div class="auth-container">
        <div class="auth-card">
          <h2 style="font-weight:900;color:var(--dark-text);margin-bottom:8px;">Welcome back</h2>
          <p style="color:var(--muted-text);margin-bottom:20px;">Sign in to check your balance, plans and referral rewards.</p>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="loginUsername" placeholder="Enter username or email">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="loginPassword" placeholder="Enter password">
          </div>
          <button class="btn-primary" style="width:100%;" onclick="handleLogin()">LOGIN</button>
        </div>
      </div>
      ${renderDrawer()}
    `;
    lucide.createIcons();
  }
  function renderRegister(app) {
    app.innerHTML = `
      ${renderHeader(app, true)}
      <div class="auth-container">
        <div class="auth-card">
          <h2 style="font-weight:900;color:var(--dark-text);margin-bottom:8px;">Create Account</h2>
          <p style="color:var(--muted-text);margin-bottom:20px;">Fill in your details to get started.</p>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="regUsername" placeholder="Enter username">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-input" id="regPhone" placeholder="03xx xxxxxxx">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="regPassword" placeholder="Password">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" id="regConfirm" placeholder="Confirm password">
          </div>
          <div class="form-group">
            <label class="form-label">Referral Code</label>
            <input type="text" class="form-input" id="regReferral" placeholder="Optional">
          </div>
          <button class="btn-primary" style="width:100%;" onclick="handleRegister()">REGISTER</button>
        </div>
      </div>
      ${renderDrawer()}
    `;
    lucide.createIcons();
  }
  function renderDashboard(app) {
    if (!state.user) return;
    const user = state.user;
    app.innerHTML = `
      ${renderHeader(app)}
      <div class="dashboard-hero">
        <div class="avatar">${user.username[0].toUpperCase()}</div>
        <div style="font-size:1.2rem;color:var(--dark-text);font-weight:600;margin-top:8px;">Welcome back,</div>
        <div style="font-size:1.8rem;font-weight:900;color:var(--dark-text);">${user.username}</div>
        <div class="rank-card">
          <span>⭐ Rank</span>
          <span style="font-weight:700;">CURRENT RANK • Start</span>
          <span>→</span>
        </div>
      </div>
      <div style="padding:0 20px;">

  function confirmPlan() {
    if (!state.selectedPlan || !state.user) return;
    const plan = state.selectedPlan;
    if (state.user.balance < plan.newPrice) {

    }
    state.user.balance -= plan.newPrice;
    if (!state.user.investments) state.user.investments = [];
    state.user.investments.push({
      planId: plan.id,
      planName: plan.name,
      amount: plan.newPrice,
      dailyProfit: plan.dailyProfit,
      createdAt: Date.now(),
      completedDays: 0,
      durationDays: 55,
      nextProfitAt: Date.now() + 24*60*60*1000,
      status: 'active'
    });

    state.user.transactions.push({ type: 'Investment', amount: plan.newPrice, status: 'Completed', timestamp: Date.now() });

  function startProfitTimer(investment) {
    clearInterval(window.timerInterval);
    const timerEl = document.getElementById('profitTimer');
    if (!timerEl) return;
    function updateTimer() {
      const now = Date.now();
      const diff = investment.nextProfitAt - now;
      if (diff <= 0) {
        if (state.user) {
          state.user.balance += investment.dailyProfit;
          investment.completedDays += 1;
          investment.nextProfitAt = now + 24*60*60*1000;
          if (investment.completedDays >= investment.durationDays) investment.status = 'completed';
          if (!state.user.transactions) state.user.transactions = [];
          state.user.transactions.push({ type: 'Profit', amount: investment.dailyProfit, status: 'Completed', timestamp: now });
          state.user.totalEarning = (state.user.totalEarning || 0) + investment.dailyProfit;
          saveState();
          showToast('Profit credited!');
          render();
        }
        return;
      }
      const hrs = Math.floor(diff / (1000*60*60));
      const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
      const secs = Math.floor((diff % (1000*60)) / 1000);
      timerEl.textContent = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    }
    updateTimer();
    window.timerInterval = setInterval(updateTimer, 1000);
  }

  function openModal(content) {

    modal.innerHTML = `<div style="background:white;border-radius:24px;padding:24px;max-width:90%;width:100%;">${content}</div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.remove();

  }
