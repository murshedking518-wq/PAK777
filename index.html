<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Pak777 Casino | Premium Gaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: {
                            gold: '#ffd700',
                            purple: '#a855f7',
                            green: '#00ff66',
                            red: '#ff3333',
                            blue: '#00d4ff',
                            pink: '#ff006e',
                            dark: '#0a0a1a',
                            darker: '#050510'
                        }
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-neon': 'pulseNeon 1.5s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'spin-slow': 'spin 3s linear infinite'
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(255,215,0,0.5), 0 0 20px rgba(255,215,0,0.3)' },
                            '100%': { boxShadow: '0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,215,0,0.5)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        pulseNeon: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.5' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #050510;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .font-orbitron { font-family: 'Orbitron', monospace; }

        #loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(ellipse at center, #0a0a2e 0%, #050510 70%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loader-ring {
            width: 80px; height: 80px;
            border: 3px solid rgba(255,215,0,0.2);
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 30px rgba(255,215,0,0.4), 0 0 60px rgba(255,215,0,0.2);
        }
        .loader-inner {
            width: 50px; height: 50px;
            border: 3px solid rgba(168,85,247,0.2);
            border-bottom: 3px solid #a855f7;
            border-radius: 50%;
            animation: spin 1.2s linear infinite reverse;
            position: absolute;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #particles-container { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .particle {
            position: absolute; border-radius: 50%;
            animation: floatParticle linear infinite;
            pointer-events: none;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .glass-card {
            background: rgba(20, 20, 50, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .glass-card-strong {
            background: rgba(30, 30, 70, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .neon-btn {
            position: relative; overflow: hidden;
            font-weight: 700; letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .neon-btn:active { transform: scale(0.95); }
        .neon-btn-gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a0a00;
            box-shadow: 0 0 20px rgba(255,215,0,0.4), 0 4px 15px rgba(0,0,0,0.3);
        }
        .neon-btn-green {
            background: linear-gradient(135deg, #00ff66, #00cc44);
            color: #001a00;
            box-shadow: 0 0 20px rgba(0,255,102,0.4), 0 4px 15px rgba(0,0,0,0.3);
        }
        .neon-btn-red {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            color: #fff;
            box-shadow: 0 0 20px rgba(255,51,51,0.4), 0 4px 15px rgba(0,0,0,0.3);
        }
        .neon-btn-purple {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            box-shadow: 0 0 20px rgba(168,85,247,0.4), 0 4px 15px rgba(0,0,0,0.3);
        }

        .game-card-3d { perspective: 1000px; cursor: pointer; }
        .game-card-3d-inner { transition: transform 0.3s ease; transform-style: preserve-3d; }
        .game-card-3d:hover .game-card-3d-inner { transform: rotateY(5deg) rotateX(3deg) translateY(-5px); }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.5); border-radius: 10px; }

        #toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            z-index: 9999; padding: 12px 24px; border-radius: 30px;
            font-weight: 700; font-size: 13px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { background: #00ff66; color: #000; }
        #toast.error { background: #ff3333; color: #fff; }
        #toast.info { background: #ffd700; color: #000; }

        /* AVIATOR */
        .av-container {
            background: #020210;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(168,85,247,0.2);

        .av-history-chip.huge { color: #ff0055; border-color: rgba(255,0,85,0.5); }
        .av-screen-container {
            position: relative; width: 100%; height: 280px;
            background: #000; overflow: hidden;
        }
        .av-screen-container canvas { width: 100%; height: 100%; display: block; }
        .av-toast {
            position: absolute; top: 15px; left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: rgba(0,255,102,0.95); color: #000;
            padding: 10px 24px; border-radius: 25px;
            font-weight: 800; font-size: 14px;
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 30px rgba(0,255,102,0.7);
            opacity: 0; transition: all 0.3s ease;
            z-index: 10; pointer-events: none;
        }
        .av-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .av-controls {
            display: grid; gap: 10px; padding: 10px;
            background: #050510;
        }
        .av-bet-box {
            background: rgba(10,10,30,0.8);
            border-radius: 16px; padding: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .av-bet-inputs { display: flex; gap: 10px; align-items: center; }
        .av-amount-control { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .av-input-wrapper {
            display: flex; align-items: center;
            background: #000; border-radius: 12px;
            padding: 8px 12px; border: 1px solid rgba(255,255,255,0.1);
        }
        .av-btn-step {
            background: none; border: none;
            color: rgba(255,255,255,0.5);
            font-size: 20px; font-weight: 700;

        .av-bet-input {
            width: 100%; background: transparent; border: none;
            color: #fff; text-align: center;
            font-weight: 800; font-size: 17px;
            font-family: 'Orbitron', monospace; outline: none;
        }
        .av-preset-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .av-btn-preset {
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            padding: 7px 4px; border-radius: 8px;
            font-size: 11px; cursor: pointer; font-weight: 700;
            transition: all 0.2s;
        }
        .av-btn-preset:hover:not(:disabled) { background: rgba(168,85,247,0.3); }
        .av-btn-action {
            flex: 1.1; height: 68px; border: none;
            border-radius: 14px; font-size: 15px;
            font-weight: 900; font-family: 'Orbitron', monospace;
            cursor: pointer; letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .av-btn-action:active { transform: scale(0.95); }
        .av-btn-action.bet {
            background: linear-gradient(180deg, #00ff66, #00b347);
            color: #000; box-shadow: 0 0 20px rgba(0,255,102,0.3);
        }
        .av-btn-action.cashout {
            background: linear-gradient(180deg, #ff9900, #cc7a00);
            color: #000; box-shadow: 0 0 25px rgba(255,153,0,0.5);
            animation: pulseCashout 0.5s infinite alternate;
        }
        .av-btn-action.queued {
            background: linear-gradient(180deg, #ff0055, #b3003b);
            color: #fff; box-shadow: 0 0 20px rgba(255,0,85,0.4);
        }
        @keyframes pulseCashout {
            0% { box-shadow: 0 0 25px rgba(255,153,0,0.5); }
            100% { box-shadow: 0 0 40px rgba(255,153,0,0.8); }
        }
        .av-sub-text { font-size: 10px; font-weight: 600; opacity: 0.9; }
    </style>
</head>

        let avEngine = { status: 'WAITING', multiplier: 1.00, target: 1.00, startTime: null, waitingProgress: 0, flightPath: [], particles: [], shockwave: 0 };

        function initAviatorEngine() { avPrepareNextRound(); requestAnimationFrame(avGameLoop); }

        function avGenerateCrashPoint() {
            if (window.appState.aviator.override !== 'AUTO') {
                const v = parseFloat(window.appState.aviator.override);
                if (!isNaN(v) && v >= 1.0) return v;
            }
            const hash = CryptoJS.SHA256(CryptoJS.lib.WordArray.random(16).toString() + Math.random()).toString();
            const h = parseInt(hash.substring(0, 8), 16);
            if (h % 33 === 0) return 1.00;
            return Math.max(1.01, Math.min(Math.floor((100 * Math.pow(2,32) - h) / (Math.pow(2,32) - h)) / 100, 100));
        }

        function avPrepareNextRound() {
            avEngine.status = 'WAITING'; avEngine.multiplier = 1.00; avEngine.waitingProgress = 0;
            avEngine.flightPath = []; avEngine.particles = []; avEngine.shockwave = 0;
            avEngine.startTime = performance.now();
            for (let i of [1,2]) {
                const b = window.appState.aviator.bets[i];
                if (b.state !== 'QUEUED') b.state = 'IDLE';
                avUpdateButtonUI(i);
            }
        }

        function avStartRound() {
            avEngine.status = 'IN_FLIGHT'; avEngine.multiplier = 1.00;
            avEngine.target = avGenerateCrashPoint(); avEngine.startTime = performance.now(); avEngine.flightPath = [];
            for (let i of [1,2]) {
                const b = window.appState.aviator.bets[i];
                if (b.state === 'QUEUED') {
                    if (window.appState.userData && window.appState.userData.balance >= b.amount) {
                        window.appState.userData.balance -= b.amount;
                        saveUserDataToFirestore(window.appState.activeUser.uid, { balance: window.appState.userData.balance });
                        updateBalanceDisplay();
                        b.state = 'ACTIVE';
                    } else { b.state = 'IDLE'; showToast('Insufficient balance!', 'error'); }
                }
                avUpdateButtonUI(i);
            }
        }

        function avTriggerCashOut(boxId) {
            const b = window.appState.aviator.bets[boxId];
            if (b.state !== 'ACTIVE') return;
            b.winAmount = b.amount * avEngine.multiplier;
            if (window.appState.userData) {
                window.appState.userData.balance += b.winAmount;
                saveUserDataToFirestore(window.appState.activeUser.uid, { balance: window.appState.userData.balance });
                updateBalanceDisplay();
            }
            avShowToast(`CASHED OUT ${b.winAmount.toFixed(2)} PKR`);
            b.state = 'IDLE'; avUpdateButtonUI(boxId);
        }

        function avTriggerCrash() {
            avEngine.status = 'CRASHED'; avEngine.startTime = performance.now();
            for (let i of [1,2]) { 
                if (window.appState.aviator.bets[i].state === 'ACTIVE') window.appState.aviator.bets[i].state = 'IDLE'; 
                avUpdateButtonUI(i); 
            }
            window.appState.aviator.history.unshift(avEngine.target);
            if (window.appState.aviator.history.length > 20) window.appState.aviator.history.pop();
            const bar = document.getElementById('avHistoryBar');
            if(bar) bar.innerHTML = window.appState.aviator.history.map(m => `<div class="av-history-chip ${m>=10?'huge':(m>=2?'high':'')}">${m.toFixed(2)}x</div>`).join('');
            if(avEngine.flightPath.length > 0) { const lp = avEngine.flightPath[avEngine.flightPath.length-1]; avCreateExplosion(lp.x, lp.y); }
        }

        function avGameLoop(ts) {
            if (avEngine.status === 'WAITING') { 
                avEngine.waitingProgress = (ts - avEngine.startTime) / 2500; 
                if (avEngine.waitingProgress >= 1) avStartRound(); 
            }
            else if (avEngine.status === 'IN_FLIGHT') {
                avEngine.multiplier = Math.pow(Math.E, 0.08 * ((ts - avEngine.startTime) / 1000));
                for (let i of [1,2]) { 
                    const b = window.appState.aviator.bets[i]; 
                    if (b.state === 'ACTIVE' && b.autoCash && avEngine.multiplier >= b.autoCashVal) avTriggerCashOut(i); 
                }
                if (avEngine.multiplier >= avEngine.target) { avEngine.multiplier = avEngine.target; avTriggerCrash(); }
                else { 
                    for (let i of [1,2]) { 
                        if (window.appState.aviator.bets[i].state === 'ACTIVE') { 
                            const s = document.getElementById(`avBtnSub${i}`); 
                            if(s) s.innerText = `${(window.appState.aviator.bets[i].amount * avEngine.multiplier).toFixed(2)} PKR`; 
                        } 
                    } 
                }
            }
            else if (avEngine.status === 'CRASHED') { if (ts - avEngine.startTime >= 2200) avPrepareNextRound(); }
            avDrawCanvas(); requestAnimationFrame(avGameLoop);
        }

        window.avUpdateLocalState = (boxId) => {
            const b = window.appState.aviator.bets[boxId];
            const ac = document.getElementById(`avAutoCashToggle${boxId}`);
            const acv = document.getElementById(`avAutoCashVal${boxId}`);
            const bi = document.getElementById(`avBetInput${boxId}`);
            if(ac) b.autoCash = ac.checked;
            if(acv) b.autoCashVal = Math.max(1.1, parseFloat(acv.value) || 1.1);
            if(bi) b.amount = Math.max(10, parseFloat(bi.value) || 10);
        };
        window.avAdjustBet = (boxId, ch) => { 
            const b = window.appState.aviator.bets[boxId]; 
            if(b.state !== 'IDLE') return; 
            b.amount = Math.max(10, b.amount + ch); 
            const inp = document.getElementById(`avBetInput${boxId}`); 
            if(inp) inp.value = b.amount; 
            avUpdateButtonUI(boxId); 
        };
        window.avSetBet = (boxId, v) => { 
            const b = window.appState.aviator.bets[boxId]; 
            if(b.state !== 'IDLE') return; 
            b.amount = v; 
            const inp = document.getElementById(`avBetInput${boxId}`); 
            if(inp) inp.value = v;

        window.avHandleAction = (boxId) => {
            if (!window.appState.authenticated) { showToast('Login required!', 'error'); return; }
            const b = window.appState.aviator.bets[boxId];
            if (b.state === 'ACTIVE') avTriggerCashOut(boxId);
            else if (b.state === 'QUEUED') { b.state = 'IDLE'; avUpdateButtonUI(boxId); showToast('Cancelled', 'info'); }
            else if (b.state === 'IDLE') {
                avUpdateLocalState(boxId);
                if (window.appState.userData.balance >= b.amount) { 
                    b.state = 'QUEUED'; avUpdateButtonUI(boxId); showToast(`Bet: ${b.amount} PKR`, 'success'); 
                }
                else showToast('Insufficient balance!', 'error');
            }
        };

        function avUpdateButtonUI(boxId) {
            const btn = document.getElementById(`avBtnAction${boxId}`), sub = document.getElementById(`avBtnSub${boxId}`);
            if(!btn||!sub) return;
            const b = window.appState.aviator.bets[boxId];
            const disable = b.state !== 'IDLE';
            const inp = document.getElementById(`avBetInput${boxId}`);
            if(inp) inp.disabled = disable;
            document.querySelectorAll(`.av-btn-preset-${boxId}`).forEach(p => p.disabled = disable);
            if (b.state === 'ACTIVE') { 
                btn.className = 'av-btn-action cashout'; 
                btn.childNodes[0].nodeValue = 'CASH OUT'; 
                sub.innerText = `${(b.amount * avEngine.multiplier).toFixed(2)} PKR`; 
            }
            else if (b.state === 'QUEUED') { 
                btn.className = 'av-btn-action queued'; 
                btn.childNodes[0].nodeValue = 'CANCEL'; 
                sub.innerText = 'Waiting...'; 
            }
            else { 
                btn.className = 'av-btn-action bet'; 
                btn.childNodes[0].nodeValue = 'BET'; 
                sub.innerText = `${b.amount} PKR`; 
            }
        }

        function avShowToast(t) { 
            const el = document.getElementById('avToastMessage'); 
            if(el) { el.innerText = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); } 
            else showToast(t, 'success'); 
        }
        function avCreateExplosion(x, y) {
            avEngine.particles = []; avEngine.shockwave = 5;
            for (let i = 0; i < 65; i++) {
                const a = Math.random() * Math.PI * 2, s = Math.random() * 8 + 2;
                avEngine.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, size: Math.random()*6+3, color: ['#ff0055','#ff9900','#ffd700','#fff'][Math.floor(Math.random()*4)], alpha:1, decay: Math.random()*0.02+0.015 });
            }
        }
        window.avResizeCanvas = () => { 
            const c = document.getElementById('avGameCanvas'); 
            if(c && c.parentElement) { c.width = c.parentElement.clientWidth; c.height = c.parentElement.clientHeight; } 
        };
        window.addEventListener('resize', () => { if(window.appState.currentTab==='aviator') avResizeCanvas(); });

        function avDrawCanvas() {
            const canvas = document.getElementById('avGameCanvas');
            if(!canvas) return;
            if(canvas.width===0) avResizeCanvas();
            const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
            
            if(avEngine.status==='WAITING') {
                ctx.fillStyle='#fff'; ctx.font='700 20px Orbitron'; ctx.textAlign='center'; ctx.fillText('WAITING...',w/2,h/2-15);
                const bw=200,bh=4;
                ctx.fillStyle='rgba(255,255,255,0.1)'; ctx.roundRect((w-bw)/2,h/2+10,bw,bh,2); ctx.fill();
                ctx.fillStyle='#ff0055'; ctx.shadowColor='#ff0055'; ctx.shadowBlur=12;
                ctx.roundRect((w-bw)/2,h/2+10,bw*Math.min(1,avEngine.waitingProgress),bh,2); ctx.fill(); ctx.shadowBlur=0;
                return;
            }

            const fp = Math.min(1,(performance.now()-avEngine.startTime)/1800);
            const px = Math.pow(fp,0.5)*0.85, py = Math.pow(fp,0.65)*0.82;
            const planeX = 35+px*(w-100), planeY = (h-35)-py*(h-100);
            if(avEngine.status==='IN_FLIGHT') avEngine.flightPath.push({x:planeX,y:planeY});

            if(avEngine.flightPath.length>1) {
                ctx.beginPath(); ctx.moveTo(0,h); avEngine.flightPath.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.lineTo(avEngine.flightPath[avEngine.flightPath.length-1].x,h); ctx.closePath();
                const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'rgba(255,0,85,0.6)'); g.addColorStop(1,'rgba(255,0,85,0)'); ctx.fillStyle=g; ctx.fill();
                ctx.beginPath(); ctx.moveTo(avEngine.flightPath[0].x,avEngine.flightPath[0].y); avEngine.flightPath.forEach(p=>ctx.lineTo(p.x,p.y));
                ctx.strokeStyle='#ff0055'; ctx.lineWidth=4; ctx.shadowColor='#ff0055'; ctx.shadowBlur=15; ctx.stroke(); ctx.shadowBlur=0;
            }

            if(avEngine.status==='IN_FLIGHT') {
                ctx.save(); ctx.translate(planeX,planeY); ctx.rotate(-0.3+fp*0.2);
                ctx.fillStyle='#ff0055'; ctx.shadowColor='#ff0055'; ctx.shadowBlur=15;
                ctx.beginPath(); ctx.moveTo(26,0);ctx.lineTo(8,-5);ctx.lineTo(-2,-20);ctx.lineTo(3,-20);ctx.lineTo(12,-4);ctx.lineTo(-14,-3);
                ctx.lineTo(-24,-13);ctx.lineTo(-20,-13);ctx.lineTo(-8,-2);ctx.lineTo(-20,0);ctx.lineTo(-8,2);ctx.lineTo(-20,13);ctx.lineTo(-24,13);
                ctx.lineTo(-14,3);ctx.lineTo(12,4);ctx.lineTo(3,20);ctx.lineTo(-2,20);ctx.lineTo(8,5);ctx.closePath();ctx.fill();
                ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.beginPath();ctx.ellipse(12,0,7,2,0,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#ff9900';ctx.shadowColor='#ff9900';ctx.shadowBlur=10;ctx.beginPath();ctx.ellipse(-24,0,18,3,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore();
            } else if(avEngine.status==='CRASHED'&&avEngine.flightPath.length>0) {
                const lp=avEngine.flightPath[avEngine.flightPath.length-1];
                if(avEngine.shockwave<80){avEngine.shockwave+=4;ctx.strokeStyle=`rgba(255,0,85,${1-avEngine.shockwave/80})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(lp.x,lp.y,avEngine.shockwave,0,Math.PI*2);ctx.stroke();}
                avEngine.particles.forEach(p=>{if(p.alpha<=0)return;p.x+=p.vx;p.y+=p.vy;p.alpha-=p.decay;ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.alpha);ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();});
                ctx.globalAlpha=1;ctx.shadowBlur=0;
            }

            ctx.textAlign='center';
            if(avEngine.status==='CRASHED'){
                ctx.fillStyle='#ff0055';ctx.font='900 36px Orbitron';ctx.shadowColor='#ff0055';ctx.shadowBlur=20;

            const phone = document.getElementById('auth-phone').value.trim();

            if (!email) { showToast('Email required!', 'error'); return; }

            if (window.appState.authMode === 'signup') {

                    const userCredential = await createUserWithEmailAndPassword(auth, email, pass);

                    // Save user data to Firestore
                    const userData = {
                        fullName: name,

                        createdAt: Date.now()

                    window.appState.authenticated = true;
                    closeAuthModal();
                    showToast(`Welcome ${name}!`, 'success');
                    renderContent();
                    updateBalanceDisplay();

                    console.error(error);
                    showToast(error.message, 'error');

                Object.keys(window.appState.wingoRooms).forEach(rk => {
                    const r = window.appState.wingoRooms[rk];
                    r.timerSec--;
                    if (r.timerSec <= 0) {
                        calculateRoomOutcome(rk);
                        r.timerSec = r.totalSec;
                    }
                });
                const el = document.getElementById('active-room-timer');
                if (el) {
                    const r = window.appState.wingoRooms[window.appState.activeWinGoRoom];
                    const m = Math.floor(r.timerSec / 60), s = r.timerSec % 60;
                    el.innerText = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                }
            }, 1000);
        }

        function initSeedHistory() {
            Object.keys(window.appState.wingoRooms).forEach(rk => {
                const r = window.appState.wingoRooms[rk];
                for (let i = 0; i < 5; i++) {
                    const n = Math.floor(Math.random() * 10);
                    r.history.push({ period: String(r.period - i - 1), number: n, size: n >= 5 ? 'Big' : 'Small', color: [1,3,7,9].includes(n) ? 'Green' : ([2,4,6,8].includes(n) ? 'Red' : 'Violet') });
                }
            });
        }

        function createParticles() {
            const c = document.getElementById('particles-container');
            const colors = ['#ffd700', '#a855f7', '#00ff66', '#00d4ff'];
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const s = Math.random() * 4 + 2;
                p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${colors[i%4]};box-shadow:0 0 ${s*3}px currentColor;animation-duration:${Math.random()*8+6}s;animation-delay:${Math.random()*8}s;`;
                c.appendChild(p);
            }
        }

        function hideLoadingScreen() {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app-container').style.display = 'flex';
            }, 2000);
        }

        // ============ INITIALIZATION ============
        window.addEventListener('DOMContentLoaded', async () => {
            createParticles();
            initSeedHistory();
            startRoomTimers();
            initAviatorEngine();

            // Load local backups
            const localDeps = loadFromLocal(DEPOSITS_KEY);
            if (localDeps) window.appState.deposits = localDeps;
            const localWds = loadFromLocal(WITHDRAWALS_KEY);
            if (localWds) window.appState.withdrawals = localWds;

            // Firebase auth state listener
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    window.appState.activeUser = user;
                    const userData = await getUserDataFromFirestore(user.uid);
                    if (userData) {
                        window.appState.userData = userData;
                        window.appState.authenticated = true;
                    } else {
                        // Should not happen, but handle gracefully
                        window.appState.authenticated = false;
                        await signOut(auth);
                    }
                } else {
                    window.appState.authenticated = false;
                    window.appState.activeUser = null;
                    window.appState.userData = null;
                }
                updateBalanceDisplay();
                renderContent();
            });

            // Firestore listeners for deposits/withdrawals/users
            onSnapshot(collection(db, 'deposits'), (snap) => {
                const list = [];
                snap.forEach(d => list.push(d.data()));
                window.appState.deposits = list.sort((a,b) => b.timestamp - a.timestamp);
                saveToLocal(DEPOSITS_KEY, window.appState.deposits);
                if (window.appState.currentTab === 'deposit') renderContent();
                renderAdminData();
            });
            onSnapshot(collection(db, 'withdrawals'), (snap) => {
                const list = [];
                snap.forEach(d => list.push(d.data()));
                window.appState.withdrawals = list.sort((a,b) => b.timestamp - a.timestamp);
                saveToLocal(WITHDRAWALS_KEY, window.appState.withdrawals);
                if (window.appState.currentTab === 'withdraw') renderContent();
                renderAdminData();
            });
            onSnapshot(collection(db, 'users'), (snap) => {
                const list = [];
                snap.forEach(d => list.push({ ...d.data(), uid: d.id }));
                window.appState.users = list;
                renderAdminData();
                // Update current user data if needed
                if (window.appState.activeUser) {
                    const updated = list.find(u => u.uid === window.appState.activeUser.uid);
                    if (updated) {
                        window.appState.userData = updated;
                        updateBalanceDisplay();
                    }
                }
            });

            renderContent();
            hideLoadingScreen();
        });
    </script>
</body>
    </html>
